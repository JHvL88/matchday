# Forecasts every match of the coming matchday with the published models and puts the result in
# data/forecasts.json, which the home page shows next to the bookmakers' odds.
#
# Runs every morning. Most runs only look at the fixture list and stop: a matchday is due from
# 72 hours before its first kick-off, is forecast once and is never refitted. On a normal weekend
# that is Thursday morning, after "Fetch source data" (Monday and Thursday 06:17 UTC) has brought
# in the last results. See analysis/pipeline/site_forecasts.py for the rules.
#
# Needs the DATA_REPO_TOKEN secret (the private data repository holds the xG the models learn
# from); without it the workflow logs a notice and stops. Set the repository variable SITE_BOT to
# "off" to stop the automatic commit.
name: Forecast the matchday

on:
  schedule:
    - cron: "41 8 * * *"
  workflow_dispatch:
    inputs:
      matchday:
        description: "Forecast this matchday now (leave empty for the next one due)"
        required: false
        default: ""
      force:
        description: "Replace a forecast that is already published (before kick-off only)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
      DATA_REPO: ${{ vars.DATA_REPO || format('{0}-data', github.repository) }}
      MATCHDAY: ${{ inputs.matchday }}
      FORCE: ${{ inputs.force }}
    steps:
      - name: Check the setup
        id: setup
        run: |
          if [ -z "$DATA_REPO_TOKEN" ]; then
            echo "::notice::Forecasts not set up: add the DATA_REPO_TOKEN secret (see README, 'Odds' and 'Weekly forecasts')."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.setup.outputs.ready == 'true'

      - uses: actions/setup-python@v5
        if: steps.setup.outputs.ready == 'true'
        with:
          python-version: "3.13"

      - name: Is a matchday due?
        id: due
        if: steps.setup.outputs.ready == 'true'
        run: |
          pip install -q numpy==2.5.3 pandas==3.0.5
          SEASON=$(python3 -c "import datetime as d; t = d.date.today(); print(t.year if t.month >= 7 else t.year - 1)")
          echo "season=$SEASON" >> "$GITHUB_OUTPUT"
          ARGS=""
          if [ -n "$MATCHDAY" ]; then ARGS="$ARGS --matchday $MATCHDAY"; fi
          if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          python analysis/pipeline/site_forecasts.py --season "$SEASON" --check $ARGS

      - uses: actions/checkout@v4
        if: steps.due.outputs.due == 'true'
        with:
          ref: source-data
          path: source

      - name: Clone the data repository (xG)
        if: steps.due.outputs.due == 'true'
        run: git clone --quiet --depth 1 "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git" data-repo

      - name: Build the match tables
        if: steps.due.outputs.due == 'true'
        run: |
          python analysis/pipeline/build_matches.py source "$RUNNER_TEMP/matches.csv" --understat data-repo/understat
          mkdir -p "$RUNNER_TEMP/tables"
          for league in ENG ESP ITA FRA; do
            python analysis/pipeline/build_matches.py source "$RUNNER_TEMP/tables/$league.csv" --league $league
          done

      - name: Fit the models and forecast
        id: run
        if: steps.due.outputs.due == 'true'
        run: |
          pip install -q -r analysis/pipeline/requirements.txt
          python analysis/pipeline/site_forecasts.py "$RUNNER_TEMP/matches.csv" --pool "$RUNNER_TEMP/tables" \
            --season "${{ steps.due.outputs.season }}" --out data/forecasts.json --work "$RUNNER_TEMP/forecast.json" \
            ${{ steps.due.outputs.args }}

      - name: Keep the full model output
        if: steps.run.outputs.published == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: forecast-md${{ steps.run.outputs.matchday }}
          path: ${{ runner.temp }}/forecast.json

      - name: Publish
        if: steps.run.outputs.published == 'true' && github.ref == 'refs/heads/main' && vars.SITE_BOT != 'off'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet data/forecasts.json && git ls-files --error-unmatch data/forecasts.json > /dev/null 2>&1; then
            echo "Forecasts unchanged."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecasts.json
          git commit --quiet -m "Forecast matchday ${{ steps.run.outputs.matchday }}"
          git pull --quiet --rebase origin main
          git push --quiet origin HEAD:main
          # pushes made with this token don't start other workflows, so ask Pages to rebuild
          curl -fsS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" > /dev/null || echo "::warning::Pages rebuild request failed; the forecasts go live with the next push."
