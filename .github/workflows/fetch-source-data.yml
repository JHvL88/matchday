# Downloads the football-data.co.uk season files straight from the source and stores them,
# byte-for-byte with SHA-256 checksums, on the `source-data` branch. That branch's history is the
# audit trail of exactly which files every backtest and forecast used.
#
# Runs when the fetcher changes, on demand (Actions tab > Fetch source data > Run workflow),
# and twice a week after football-data.co.uk's own updates (Sunday and Wednesday nights).
name: Fetch source data

on:
  workflow_dispatch:
  push:
    paths:
      - analysis/pipeline/fetch_football_data.py
      - .github/workflows/fetch-source-data.yml
  schedule:
    - cron: "17 6 * * 1,4"   # Monday and Thursday 06:17 UTC

permissions:
  contents: write
  pages: write

concurrency:
  group: source-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download football-data.co.uk files
        run: python analysis/pipeline/fetch_football_data.py --out "$RUNNER_TEMP/out" 2>&1 | tee "$RUNNER_TEMP/fetch_log.txt"

      - name: Commit to the source-data branch
        # Runs only if every file downloaded, so a partial fetch never replaces good files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          git clone --quiet --no-checkout "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin source-data > /dev/null; then
            git checkout --quiet source-data
          else
            git switch --quiet --orphan source-data
          fi
          # Only record a new version when a file actually changed (the manifest's timestamps always do)
          if [ -f manifest.json ] && [ -f "$RUNNER_TEMP/out/manifest.json" ] && python3 - "$RUNNER_TEMP/out/manifest.json" <<'PY'
          import json, sys
          files = lambda p: sorted((f["path"], f["sha256"]) for f in json.load(open(p))["files"])
          sys.exit(0 if files("manifest.json") == files(sys.argv[1]) else 1)
          PY
          then
            echo "Every file is unchanged since the last fetch."
            exit 0
          fi
          rm -rf football-data
          if [ -d "$RUNNER_TEMP/out" ]; then cp -r "$RUNNER_TEMP/out/." .; fi
          cp "$RUNNER_TEMP/fetch_log.txt" .
          cat > README.md <<'EOF'
          # Source data for Jan's Matchday

          Season files from [football-data.co.uk](https://www.football-data.co.uk/), saved exactly as served,
          with a SHA-256 checksum per file in `manifest.json`. Written by the `Fetch source data` workflow on `main`;
          don't edit by hand. Column key: https://www.football-data.co.uk/notes.txt

          Data © football-data.co.uk, used for non-commercial analysis with thanks.
          EOF
          git add -A
          if git diff --cached --quiet; then
            echo "No changes since the last fetch."
          else
            git commit --quiet -m "Fetch football-data.co.uk files ($(date -u +%Y-%m-%dT%H:%MZ), ${GITHUB_SHA::7})"
            git push --quiet origin source-data
          fi

      - name: Add closing odds to published forecasts
        if: github.ref == 'refs/heads/main' && vars.SITE_BOT != 'off'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install -q numpy==2.5.3 pandas==3.0.5
          python analysis/pipeline/grade_posts.py "$RUNNER_TEMP/out" analysis/posts.json
          if git diff --quiet analysis/posts.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/posts.json
          git commit --quiet -m "Add closing odds to published forecasts"
          git pull --quiet --rebase origin main
          git push --quiet origin HEAD:main
          curl -fsS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" > /dev/null || echo "::warning::Pages rebuild request failed."
